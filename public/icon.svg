<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="104" fill="#020617"/>
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background subtle halo -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#0ea5e9" stroke-opacity="0.15" stroke-width="40"/>
  <!-- Scientific / Community Intersecting Orbits -->
  <ellipse cx="256" cy="256" rx="170" ry="70" fill="none" stroke="url(#cyanGrad)" stroke-width="22" transform="rotate(-30 256 256)" filter="url(#glow)"/>
  <ellipse cx="256" cy="256" rx="170" ry="70" fill="none" stroke="url(#amberGrad)" stroke-width="20" transform="rotate(30 256 256)"/>
  <!-- Central Nucleus Node -->
  <circle cx="256" cy="256" r="38" fill="#38bdf8"/>
  <circle cx="256" cy="256" r="22" fill="#ffffff"/>
  <!-- Orbital Peripheral Nodes -->
  <circle cx="130" cy="180" r="14" fill="#22d3ee"/>
  <circle cx="382" cy="332" r="14" fill="#38bdf8"/>
  <circle cx="130" cy="332" r="14" fill="#f59e0b"/>
  <circle cx="382" cy="180" r="14" fill="#fbbf24"/>
</svg>
